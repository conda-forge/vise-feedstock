schema_version: 1

context:
  name: vise
  version: "0.9.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/vise-${{ version }}.tar.gz
  sha256: a228e60b91510ac339dcd6826673f46205bd8d4b07f4b6f18913a75dac5632f2
  patches:
    - requirements.patch

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - vise = vise.cli.main:main
      - vise_util = vise.cli.main_util:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - mp-api
    - python >=${{ python_min }}
    - pymatgen
    - seekpath
    - num2words
    - more-itertools
    - phonopy

tests:
  - python:
      imports:
        - vise
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Package for handling io of vasp package in kumagai group at IMR, Tohoku university
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/kumagai-group/vise

extra:
  recipe-maintainers:
    - jan-janssen
